<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 6px;
      text-align: center;
    }

    .login-card p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>로그인</h1>
    <p>아이디와 비밀번호를 입력하면 페이지로 이동합니다.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" placeholder="아무거나 입력" required />
      </div>

      <div class="form-group">
        <label for="userPw">비밀번호</label>
        <input type="password" id="userPw" placeholder="아무거나 입력" required />
      </div>

      <button type="submit">로그인</button>
    </form>
  </div>

  <script>
    // 여기에 로그인 후 이동할 웹페이지 주소를 입력하세요.
    const TARGET_URL = "https://koreacodemonkey.github.io/itda-pknu/";

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const userId = document.getElementById("userId").value.trim();
      localStorage.setItem("loggedInUser", userId);

      // 같은 탭에서 이동하려면 아래 줄을 사용하세요.
      window.location.href = TARGET_URL;

      // 새 탭으로 열려면 위 줄 대신 아래 줄을 사용하세요.
      // window.open(TARGET_URL, "_blank");
    });
  </script>
</body>
</html>
